name: Deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: hospital-promotion
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m hospital.validate
      - run: cp dbt/profiles.example.yml dbt/profiles.yml
      - run: dbt parse --project-dir dbt --profiles-dir dbt --target dev
  dev:
    needs: validate
    environment: dev
    concurrency: hospital-dev
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY_PATH: ${{ github.workspace }}/.deploy-key.p8
      PRIVATE_KEY_CONTENT: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -c "import os,pathlib; p=pathlib.Path(os.environ['SNOWFLAKE_PRIVATE_KEY_PATH']); p.write_text(os.environ['PRIVATE_KEY_CONTENT']); p.chmod(0o600)"
      - run: cp dbt/profiles.example.yml dbt/profiles.yml
      - run: python -m hospital.core generate
      - run: python -m hospital.live migrate
      - run: python -m hospital.live load
      - run: python -m hospital.dbt_run build
      - if: always()
        run: python -c "import os,pathlib; pathlib.Path(os.environ['SNOWFLAKE_PRIVATE_KEY_PATH']).unlink(missing_ok=True)"
  prod:
    needs: dev
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY_PATH: ${{ github.workspace }}/.deploy-key.p8
      PRIVATE_KEY_CONTENT: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -c "import os,pathlib; p=pathlib.Path(os.environ['SNOWFLAKE_PRIVATE_KEY_PATH']); p.write_text(os.environ['PRIVATE_KEY_CONTENT']); p.chmod(0o600)"
      - run: cp dbt/profiles.example.yml dbt/profiles.yml
      - run: python -m hospital.core generate
      - run: python -m hospital.live migrate --env prod
      - run: python -m hospital.live load --env prod
      - run: python -m hospital.dbt_run --env prod build
      - run: python -m hospital.production_check
      - if: always()
        run: python -c "import os,pathlib; pathlib.Path(os.environ['SNOWFLAKE_PRIVATE_KEY_PATH']).unlink(missing_ok=True)"
