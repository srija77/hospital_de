version: 2
models:
  - name: fct_admissions
    config:
      contract:
        enforced: true
    columns:
      - name: admission_id
        data_type: number(38,0)
        data_tests: [unique, not_null]
      - name: patient_key
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_patients')
                field: patient_key
      - name: patient_id
        data_type: number(38,0)
        data_tests: [not_null]
      - name: admit_date
        data_type: date
      - name: discharge_date
        data_type: date
      - name: department
        data_type: varchar
      - name: admission_type
        data_type: varchar
      - name: bill_amount
        data_type: number(18,2)
      - name: status
        data_type: varchar
      - name: updated_at
        data_type: timestamp_tz
      - name: event_version
        data_type: number(38,0)
      - name: length_of_stay
        data_type: number(38,0)
  - name: dim_patients
    config:
      contract:
        enforced: true
    columns:
      - name: patient_key
        data_type: varchar
        data_tests: [unique, not_null]
      - name: patient_id
        data_type: number(38,0)
        data_tests: [not_null]
      - name: patient_name
        data_type: varchar
      - name: email
        data_type: varchar
      - name: phone
        data_type: varchar
      - name: date_of_birth
        data_type: date
      - name: city
        data_type: varchar
      - name: valid_from
        data_type: timestamp_tz
      - name: valid_to
        data_type: timestamp_tz
      - name: is_current
        data_type: boolean
